<!DOCTYPE html>
<html>
<head>
<title>Medical Report Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #e8f4f8 0%, #d4e9f0 100%);
    min-height: 100vh;
    padding: 40px 20px;
    margin: 0;
  }
  .container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,80,120,0.12);
  }
  .header { text-align: center; margin-bottom: 25px; }
  .header .icon { font-size: 42px; }
  h1 {
    color: #0f4c5c;
    font-size: 26px;
    margin: 8px 0 4px;
  }
  .subtitle { color: #6b8a94; font-size: 14px; }

  #dropArea {
    border: 2px dashed #4fa8c9;
    border-radius: 12px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    color: #2c6e8c;
    background: #f4fbfd;
    transition: 0.2s;
    font-size: 15px;
  }
  #dropArea:hover { background: #e6f5fa; border-color: #2c9cc4; }
  #dropArea .upload-icon { font-size: 32px; display: block; margin-bottom: 8px; }

  #results { margin-top: 22px; }
  .card {
    background: #fafdfe;
    border: 1px solid #e0eef2;
    border-left: 5px solid #2c9cc4;
    padding: 18px 20px;
    margin-bottom: 14px;
    border-radius: 10px;
  }
  .card .test-name { font-size: 16px; font-weight: 600; color: #0f4c5c; }
  .card .value-badge {
    display: inline-block;
    background: #eaf6fb;
    color: #1a7a9c;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 13px;
    margin-left: 8px;
  }
  .card .explanation { margin-top: 10px; color: #3a4a4f; font-size: 14px; line-height: 1.5; }

  #loading {
    text-align: center;
    margin-top: 20px;
    display: none;
    color: #2c9cc4;
    font-size: 14px;
  }
  .spinner {
    border: 3px solid #e0eef2;
    border-top: 3px solid #2c9cc4;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 8px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .error {
    color: #c0392b;
    text-align: center;
    margin-top: 15px;
    background: #fdecea;
    padding: 10px;
    border-radius: 8px;
    display: none;
  }
  .disclaimer {
    margin-top: 25px;
    font-size: 12px;
    color: #8fa5ab;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="icon">🩺</span>
    <h1>Medical Report Analyzer</h1>
    <div class="subtitle">Upload your report and get a simple explanation</div>
  </div>

  <div id="dropArea">
    <span class="upload-icon">📄</span>
    Click to upload a medical report (PNG/JPG)
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" style="display:none">
  </div>

  <div id="loading"><div class="spinner"></div>Analyzing your report...</div>
  <div id="errorMsg" class="error"></div>
  <div id="results"></div>

  <div class="disclaimer">This tool provides general information only and is not a substitute for professional medical advice.</div>
</div>

<script>
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');
const errorDiv = document.getElementById('errorMsg');

dropArea.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  resultsDiv.innerHTML = '';
  errorDiv.style.display = 'none';
  errorDiv.innerText = '';
  loadingDiv.style.display = 'block';

  const formData = new FormData();
  formData.append('file', file);

  try {
       const response = await fetch('/upload-report', {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    loadingDiv.style.display = 'none';

    if (!response.ok) {
      errorDiv.innerText = data.detail || 'Something went wrong.';
      errorDiv.style.display = 'block';
      return;
    }

    if (data.findings.length === 0) {
      resultsDiv.innerHTML = '<p style="text-align:center;color:#8fa5ab;">No test values could be detected in this image.</p>';
      return;
    }

    data.findings.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="test-name">${f.test_name}</span>
        <span class="value-badge">${f.value} ${f.unit}</span>
        <div class="explanation">${f.simple_explanation}</div>
      `;
      resultsDiv.appendChild(card);
    });

  } catch (err) {
    loadingDiv.style.display = 'none';
    errorDiv.innerText = 'Could not connect to the server. Is it running?';
    errorDiv.style.display = 'block';
  }
});
</script>
</body>
</html>
